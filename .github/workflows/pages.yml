name: Deploy to GitHub Pages

# The live site is now the combined 8-model site (hub at /, this page at /sealion-7/),
# built and published from the parent folder with `node site/build.mjs && node site/deploy.mjs`.
# This workflow only deploys SEALION 7 alone, so it no longer runs on push — running it by hand
# would replace the combined site.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: touch dist/.nojekyll
      - name: Publish dist/ to the gh-pages branch
        working-directory: dist
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
